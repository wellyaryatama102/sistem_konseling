<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIKS SMKN 2 Guguak - Seluruh Wireframe Menu & Tampilan Interaktif</title>
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f1f5f9;
            color: #000000;
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .main-header {
            text-align: center;
            margin-bottom: 14px;
        }
        .main-header h1 {
            font-size: 21px;
            font-weight: 800;
            color: #000000;
            letter-spacing: -0.5px;
        }
        .main-header p {
            font-size: 12px;
            color: #475569;
            margin-top: 3px;
        }

        /* Role Navigation Bar */
        .role-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
            justify-content: center;
            max-width: 1160px;
        }
        .role-btn {
            padding: 8px 15px;
            background: #ffffff;
            border: 1.5px solid #000000;
            border-radius: 6px;
            font-size: 11.5px;
            font-weight: 600;
            color: #000000;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .role-btn:hover {
            background: #f1f5f9;
        }
        .role-btn.active {
            background: #000000;
            color: #ffffff;
        }

        /* Sub-screen Navigation */
        .sub-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 18px;
            justify-content: center;
            max-width: 1160px;
            background: #e2e8f0;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }
        .sub-btn {
            padding: 5px 10px;
            background: #ffffff;
            border: 1px solid #94a3b8;
            border-radius: 5px;
            font-size: 10.5px;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
            transition: all 0.15s;
        }
        .sub-btn:hover {
            background: #f8fafc;
            border-color: #000000;
        }
        .sub-btn.active {
            background: #000000;
            color: #ffffff;
            border-color: #000000;
            font-weight: 600;
        }

        /* Wireframe Sheet Container */
        .wireframe-sheet {
            display: none;
            background: #ffffff;
            padding: 22px;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            border: 1.5px solid #000000;
            max-width: 1160px;
            width: 100%;
        }
        .wireframe-sheet.active {
            display: block;
        }
        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1.5px solid #000000;
            flex-wrap: wrap;
            gap: 8px;
        }
        .sheet-title-box h2 {
            font-size: 15px;
            font-weight: 700;
            color: #000000;
        }
        .sheet-title-box p {
            font-size: 11.5px;
            color: #475569;
            margin-top: 2px;
        }
        .btn-group {
            display: flex;
            gap: 6px;
        }
        .action-button {
            padding: 6px 12px;
            background: #000000;
            color: #ffffff;
            border: 1px solid #000000;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }
        .action-button:hover {
            background: #334155;
        }
        .action-button.outline {
            background: #ffffff;
            color: #000000;
        }
        .action-button.outline:hover {
            background: #f1f5f9;
        }

        /* Low-Fidelity Wireframe SVG Styling */
        svg {
            width: 100%;
            height: auto;
            display: block;
            background: #ffffff;
        }

        /* SVG Wireframe Standard Classes */
        .wf-bg { fill: #ffffff; stroke: #000000; stroke-width: 1.8; }
        .wf-sidebar { fill: #fafafa; stroke: #000000; stroke-width: 1.5; }
        .wf-header { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
        .wf-card { fill: #ffffff; stroke: #000000; stroke-width: 1.4; rx: 4; ry: 4; }
        .wf-card-header { fill: #f1f5f9; stroke: #000000; stroke-width: 1.2; }
        .wf-input { fill: #ffffff; stroke: #000000; stroke-width: 1.2; rx: 3; ry: 3; }
        .wf-btn-primary { fill: #000000; stroke: #000000; stroke-width: 1.2; rx: 3; ry: 3; }
        .wf-btn-secondary { fill: #ffffff; stroke: #000000; stroke-width: 1.2; rx: 3; ry: 3; }
        .wf-table-header { fill: #f8fafc; stroke: #000000; stroke-width: 1.2; }
        .wf-table-row { fill: #ffffff; stroke: #000000; stroke-width: 0.8; }
        .wf-table-row-alt { fill: #f8fafc; stroke: #000000; stroke-width: 0.8; }
        .wf-badge { fill: #ffffff; stroke: #000000; stroke-width: 1; rx: 8; ry: 8; }
        .wf-modal-overlay { fill: rgba(0,0,0,0.5); }
        .wf-modal { fill: #ffffff; stroke: #000000; stroke-width: 2; rx: 6; ry: 6; }
        
        /* Wireframe Typography (Poppins) */
        .wf-text-title { font-size: 14px; font-weight: 700; fill: #000000; font-family: 'Poppins', sans-serif; }
        .wf-text-subtitle { font-size: 12px; font-weight: 600; fill: #334155; font-family: 'Poppins', sans-serif; }
        .wf-text-body { font-size: 11px; font-weight: 500; fill: #000000; font-family: 'Poppins', sans-serif; }
        .wf-text-muted { font-size: 10px; font-weight: 400; fill: #64748b; font-family: 'Poppins', sans-serif; }
        .wf-text-btn-pri { font-size: 11px; font-weight: 600; fill: #ffffff; font-family: 'Poppins', sans-serif; text-anchor: middle; }
        .wf-text-btn-sec { font-size: 11px; font-weight: 600; fill: #000000; font-family: 'Poppins', sans-serif; text-anchor: middle; }
        .wf-text-nav { font-size: 10.5px; font-weight: 500; fill: #000000; font-family: 'Poppins', sans-serif; }
        .wf-text-nav-active { font-size: 10.5px; font-weight: 700; fill: #ffffff; font-family: 'Poppins', sans-serif; }
        .wf-text-badge { font-size: 9px; font-weight: 600; fill: #000000; font-family: 'Poppins', sans-serif; text-anchor: middle; }

        @media print {
            body { background: white; padding: 0; }
            .main-header, .role-nav, .sub-nav, .sheet-header, .btn-group { display: none; }
            .wireframe-sheet { box-shadow: none; border: none; padding: 0; max-width: 100%; }
            .wireframe-sheet.active { display: block; }
        }
    </style>
</head>
<body>

    <div class="main-header">
        <h1>SIKS SMKN 2 GUGUAK - RANCANGAN WIREFRAME LENGKAP</h1>
        <p>Seluruh Menu Navigasi, Form Tambah &amp; Edit, Modal Aksi, Beranda Siswa, Dashboard Eksekutif &amp; Output Laporan (B&amp;W Low-Fidelity)</p>
    </div>

    <!-- ROLE NAVIGATION -->
    <div class="role-nav">
        <button class="role-btn active" onclick="switchRole(0)">1. Autentikasi &amp; Profil</button>
        <button class="role-btn" onclick="switchRole(1)">2. Admin</button>
        <button class="role-btn" onclick="switchRole(2)">3. Guru BK</button>
        <button class="role-btn" onclick="switchRole(3)">4. Wali Kelas</button>
        <button class="role-btn" onclick="switchRole(4)">5. Siswa</button>
        <button class="role-btn" onclick="switchRole(5)">6. Wakasis</button>
        <button class="role-btn" onclick="switchRole(6)">7. Kepala Sekolah</button>
    </div>

    <!-- SUB-SCREEN NAVIGATION BAR -->
    <div class="sub-nav" id="sub-nav-container">
        <!-- Injected via JavaScript -->
    </div>

    <div id="sheets-container">
        <!-- Injected via JavaScript -->
    </div>

    <script src="wireframes_data.js"></script>
    <script>
        // Check if data is loaded, then render
        let currentRoleIndex = 0;
        let currentSubIndex = 0;

        function switchRole(roleIndex) {
            currentRoleIndex = roleIndex;
            currentSubIndex = 0;

            const roleBtns = document.querySelectorAll('.role-nav .role-btn');
            roleBtns.forEach((btn, i) => {
                if (i === roleIndex) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            renderSubNav();
            renderCurrentSheet();
        }

        function renderSubNav() {
            const container = document.getElementById('sub-nav-container');
            container.innerHTML = '';

            const screens = roleData[currentRoleIndex].screens;
            screens.forEach((sc, i) => {
                const btn = document.createElement('button');
                btn.className = `sub-btn ${i === currentSubIndex ? 'active' : ''}`;
                btn.textContent = `${i + 1}. ${sc.title}`;
                btn.onclick = () => {
                    currentSubIndex = i;
                    renderSubNav();
                    renderCurrentSheet();
                };
                container.appendChild(btn);
            });
        }

        function renderCurrentSheet() {
            const sheetsContainer = document.getElementById('sheets-container');
            const screen = roleData[currentRoleIndex].screens[currentSubIndex];
            
            sheetsContainer.innerHTML = `
                <div class="wireframe-sheet active" id="wf-sheet-${screen.id}">
                    <div class="sheet-header">
                        <div class="sheet-title-box">
                            <h2>${screen.num} ${screen.title}</h2>
                            <p>${screen.desc}</p>
                        </div>
                        <div class="btn-group">
                            <button class="action-button" onclick="window.print()">🖨️ Cetak PDF</button>
                            <button class="action-button outline" onclick="downloadWfImage('${screen.id}', 'png')">Download PNG</button>
                            <button class="action-button outline" onclick="downloadWfImage('${screen.id}', 'jpg')">Download JPG</button>
                        </div>
                    </div>
                    ${screen.svgContent}
                </div>
            `;
        }

        function downloadWfImage(sheetId, format) {
            const svgElement = document.querySelector(`#wf-sheet-${sheetId} svg`);
            if (!svgElement) return;

            // Clone to avoid modifying the active DOM
            const clonedSvg = svgElement.cloneNode(true);
            
            // Find or create defs inside clone
            let defs = clonedSvg.querySelector('defs');
            if (!defs) {
                defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                clonedSvg.insertBefore(defs, clonedSvg.firstChild);
            }

            // Copy all styles from parent document to ensure styles are applied inside image context
            const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
            let cssText = '';
            for (const sheet of document.styleSheets) {
                try {
                    const rules = sheet.cssRules || sheet.rules;
                    if (rules) {
                        for (const rule of rules) {
                            cssText += rule.cssText + '\n';
                        }
                    }
                } catch (e) {
                    console.warn('Could not read stylesheet rules: ', e);
                }
            }
            style.textContent = cssText;
            defs.appendChild(style);

            const serializer = new XMLSerializer();
            let svgString = serializer.serializeToString(clonedSvg);
            
            if (!svgString.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
                svgString = svgString.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
            }

            const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const URL = window.URL || window.webkitURL || window;
            const blobURL = URL.createObjectURL(svgBlob);
            
            const image = new Image();
            image.onload = function() {
                const scaleFactor = 3; // 3x HD Resolution
                const canvas = document.createElement('canvas');
                
                let width = 1000;
                let height = 640;
                if (svgElement.viewBox && svgElement.viewBox.baseVal) {
                    width = svgElement.viewBox.baseVal.width || width;
                    height = svgElement.viewBox.baseVal.height || height;
                }
                
                canvas.width = width * scaleFactor;
                canvas.height = height * scaleFactor;
                
                const context = canvas.getContext('2d');
                context.fillStyle = '#ffffff';
                context.fillRect(0, 0, canvas.width, canvas.height);
                context.drawImage(image, 0, 0, canvas.width, canvas.height);
                
                const mimeType = format === 'jpg' ? 'image/jpeg' : 'image/png';
                const quality = format === 'jpg' ? 0.95 : 1.0;
                const dataUrl = canvas.toDataURL(mimeType, quality);
                
                const roleNameRaw = roleData[currentRoleIndex].name;
                const roleName = roleNameRaw.replace(/^\d+\.\s*/, '').trim();
                const screenTitleRaw = roleData[currentRoleIndex].screens[currentSubIndex].title;
                const screenTitle = screenTitleRaw.trim();
                
                function cleanStringForFilename(str) {
                    return str
                        .replace(/&/g, 'Dan')
                        .replace(/[^a-zA-Z0-9]/g, '-')
                        .replace(/-+/g, '-')
                        .replace(/^-|-$/g, '');
                }
                
                const cleanRole = cleanStringForFilename(roleName);
                const cleanScreen = cleanStringForFilename(screenTitle);
                const fileName = `Wireframe-${cleanRole}-${cleanScreen}`;
                
                const downloadLink = document.createElement('a');
                downloadLink.download = `${fileName}.${format}`;
                downloadLink.href = dataUrl;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
                URL.revokeObjectURL(blobURL);
            };
            image.src = blobURL;
        }

        // Initialize
        if (typeof roleData !== 'undefined') {
            renderSubNav();
            renderCurrentSheet();
        } else {
            window.onload = function() {
                renderSubNav();
                renderCurrentSheet();
            };
        }
    </script>
</body>
</html>
