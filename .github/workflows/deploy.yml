name: Deploy siks.webta.my.id

on:
  push:
    branches:
      - main # Script berjalan otomatis saat Anda push ke branch main

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Mengambil kode terbaru
      uses: actions/checkout@v3

    - name: Menyiapkan PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2' # Ubah ke 8.3 jika Laravel 12 Anda menggunakan PHP 8.3

    - name: Install dependencies Laravel (Composer)
      run: composer install --no-dev --optimize-autoloader

    - name: Menyiapkan Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Compile CSS & JS (Vite)
      run: |
        npm install
        npm run build

    - name: Mengirim file ke cPanel via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          .env.example
          .env