            height: auto;
            display: block;
        }
        .btn-box {

            display: flex;
            gap: 12px;
        }
        .btn-print {

            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-print:hover {
            background: #0369a1;
        }
        .btn-print.outline {
            background: #ffffff;
            color: #0284c7;
            border: 1.5px solid #0284c7;
        }
        .btn-print.outline:hover {
            background: #f0f9ff;
        }
        @media print {
            body { background: white; padding: 0; }
            .diagram-container { box-shadow: none; padding: 0; }
            .btn-box, .header { display: none; }
        }
    </style>
</head>

        <button class="btn-print outline" id="btn-download-png">Download PNG</button>
        <button class="btn-print outline" id="btn-download-jpg">Download JPG</button>
    </div>

    <script>
        function downloadImage(format) {
            const svgElement = document.querySelector('.diagram-container svg');
            if (!svgElement) return;

            // Clone to avoid modifying the active DOM
            const clonedSvg = svgElement.cloneNode(true);
            
            // Find or create defs
            let defs = clonedSvg.querySelector('defs');
            if (!defs) {
                defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                clonedSvg.insertBefore(defs, clonedSvg.firstChild);
            }

            // Copy all styles from parent document to ensure external fonts/styles are applied
            const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
            let cssText = '';
            for (const sheet of document.styleSheets) {
                try {
                    const rules = sheet.cssRules || sheet.rules;
                    if (rules) {
                        for (const rule of rules) {
                            cssText += rule.cssText + '\n';
                        }
                    }
                } catch (e) {
                    console.warn('Could not read stylesheet rules: ', e);
                }
            }
            style.textContent = cssText;
            defs.appendChild(style);

            const serializer = new XMLSerializer();
            let svgString = serializer.serializeToString(clonedSvg);
            
            if (!svgString.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
                svgString = svgString.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
            }

            const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const URL = window.URL || window.webkitURL || window;
            const blobURL = URL.createObjectURL(svgBlob);
            
            const image = new Image();
            image.onload = function() {
                const scaleFactor = 3; // 3x HD Resolution
                const canvas = document.createElement('canvas');
                
                // Get viewBox width & height or defaults
                let width = 1080;
                let height = 1010;
                if (svgElement.viewBox && svgElement.viewBox.baseVal) {
                    width = svgElement.viewBox.baseVal.width || width;
                    height = svgElement.viewBox.baseVal.height || height;
                }
                
                canvas.width = width * scaleFactor;
                canvas.height = height * scaleFactor;
                
                const context = canvas.getContext('2d');
                context.fillStyle = '#ffffff';
                context.fillRect(0, 0, canvas.width, canvas.height);
                context.drawImage(image, 0, 0, canvas.width, canvas.height);
                
                const mimeType = format === 'jpg' ? 'image/jpeg' : 'image/png';
                const quality = format === 'jpg' ? 0.95 : 1.0;
                const dataUrl = canvas.toDataURL(mimeType, quality);
                
                const downloadLink = document.createElement('a');
                downloadLink.download = `Use-Case.${format}`;
                downloadLink.href = dataUrl;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
                URL.revokeObjectURL(blobURL);
            };
            image.src = blobURL;
        }

        document.getElementById('btn-download-png').addEventListener('click', () => downloadImage('png'));
        document.getElementById('btn-download-jpg').addEventListener('click', () => downloadImage('jpg'));
    </script>
